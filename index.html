<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Pricing Engine – UI prototype</title>
<style>
html{background:#f5f4ef;color:#1f1e1d;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;padding:48px;display:flex;flex-direction:column;align-items:center;gap:48px}
.board h2{margin:0 0 12px;font-size:13px;font-weight:500;color:#6b6a68}
.board h2 a{color:inherit}
.board{width:100%;max-width:1440px}
.board iframe{display:block;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);max-width:100%}
@media (max-width:767px){body{padding:16px;gap:32px;align-items:stretch}.board iframe{width:100%!important}.board:first-child iframe{height:2600px!important}.board:last-child{max-width:390px;margin:0 auto}}
html{background:#E9ECF2;font-family:'Manrope',system-ui,sans-serif}
.board h2{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:#0E2240;box-shadow:0 1px 2px rgba(14,34,64,.08)}
.board h2 a{text-decoration:none}.board h2 a:hover{color:#1F5FBF}
.board iframe{border-radius:20px;box-shadow:0 1px 2px rgba(14,34,64,.06),0 24px 60px -20px rgba(14,34,64,.28)!important}
.board:last-child iframe{border-radius:36px;outline:10px solid #0B1B33}
</style>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<section class="board">
  <h2><a href="sales-rep.html">Sales rep – Parameters and result (desktop / mobile)</a></h2>
  <iframe src="sales-rep.html" title="Sales rep" width="1440" height="1700" style="width:1440px;height:1700px"></iframe>
</section>
<section class="board">
  <h2><a href="approver.html">Sales manager – Approver view (phone)</a></h2>
  <iframe src="approver.html" title="Sales manager – Approver view" width="390" height="844" style="width:390px;height:844px"></iframe>
</section>
</body>
</html>

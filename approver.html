                    body {

                        --bg: #f3f4f6;

                            --bar-cost: #5e6b7a;
                            --head: #0b111b;
                        }
                    }
                    .ap a {
                        color: var(--link);
                    }

                        color: var(--ink);
                    }
                    .ap p,

                    .ap h2 {
                        margin: 0;
                    }
                    .ap :focus-visible {
                        outline: 2px solid var(--link);
                        outline-offset: 2px;
                    }
                    .ap label {
                        font-weight: 500;
                        font-size: 13px;
                        color: var(--ink);
                    }
                    .ap input[type="text"],
                    .ap textarea {
                        width: 100%;
                        min-height: 44px;
                        padding: 10px 12px;
                        border: 1px solid var(--field);
                        border-radius: 0;
                        background: var(--card);
                        color: var(--text);
                        font: inherit;
                    }
                    .btn {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                        width: 100%;
                        min-height: 52px;
                        padding: 0 16px;
                        border: 1px solid var(--accent);
                        background: var(--accent);
                        color: #ffffff;
                        font: inherit;
                        font-weight: 600;
                        border-radius: 0;
                        cursor: pointer;
                    }
                    .btn.sec {
                        background: var(--card);
                        color: var(--link);
                        border-color: var(--field);
                    }
                    .btn.ghost {
                        background: transparent;
                        border-color: transparent;
                        color: var(--link);
                        width: auto;
                        min-height: 44px;
                        padding: 0 6px;
                    }
                    .btn:disabled {
                        opacity: 0.45;
                        cursor: not-allowed;
                    }
                    .chip {
                        display: inline-flex;
                        align-items: center;
                        gap: 6px;
                        min-height: 28px;
                        padding: 2px 10px;
                        border: 1px solid var(--field);
                        font-size: 13px;
                        font-weight: 500;
                        color: var(--ink);
                        background: var(--card);
                    }
                    button.chip {
                        min-height: 44px;
                        cursor: pointer;
                        font-family: inherit;
                    }
                    button.chip[aria-pressed="true"] {
                        background: var(--accent);
                        border-color: var(--accent);
                        color: #ffffff;
                    }
                    .row {
                        display: flex;

                        padding: 8px 0;
                        border-bottom: 1px solid var(--line);

                        text-align: right;

                    }

                    .ap .btn {
                        min-height: 52px;
                        border-radius: 12px;
                    }
                </style>
            </helmet>
            <div
                class="ap ap-screen {{themeClass}}"
                style="display: flex; flex-direction: column; overflow: hidden"
            >
                <header
                    style="
                        background: var(--head);
                        color: #ffffff;
                        padding: 14px 16px;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        gap: 8px;
                        flex: none;
                    "
                >
                    <div style="display: flex; flex-direction: column">
                        <span style="font-weight: 700; font-size: 16px"
                            >Approval request</span
                        >
                        <span style="font-size: 12px; color: #c9d6e5"
                            >Smart Pricing Engine</span
                        >
                    </div>
                </header>

                <div
                    style="
                        flex: 1 1 auto;
                        overflow-y: auto;
                        padding: 16px;
                        display: flex;
                        flex-direction: column;
                        gap: 16px;
                    "
                >
                    <div
                        role="status"
                        style="
                            background: var(--card);
                            border: 1px solid var(--line);
                            padding: 20px;
                            display: flex;
                            flex-direction: column;
                            gap: 12px;
                        "
                    >
                        <span
                            style="
                                background: var(--accent-soft);
                                color: var(--ink);
                                display: inline-flex;
                                align-items: center;
                                gap: 8px;
                                align-self: flex-start;
                                padding: 6px 12px;
                                font-weight: 600;
                            "
                        >
                            <svg
                                width="18"
                                height="18"
                                sc-camel-view-box="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.2"
                                aria-hidden="true"
                            >
                                <circle cx="12" cy="12" r="9"></circle>
                                <polyline points="12 7 12 12 15 14"></polyline>
                            </svg>
                            <span>Waiting for approval</span>
                        </span>
                        <p
                            style="
                                color: var(--ink);
                                font-weight: 700;
                                font-size: 18px;
                            "
                        >
                            Your request has been sent.
                        </p>
                        <p style="font-size: 14px">{{sentText}}</p>
                    </div>

                    <div
                        style="
                            background: var(--card);
                            border: 1px solid var(--line);
                            padding: 16px;
                            display: flex;
                            flex-direction: column;
                            gap: 10px;
                        "
                    >
                        <span style="font-size: 13px; color: var(--muted)"
                            >{{custLine}}</span
                        >
                        <span
                            style="
                                font-weight: 700;
                                color: var(--ink);
                                font-size: 16px;
                            "
                            >{{artLine}}</span
                        >
                        <div
                            style="
                                display: grid;
                                grid-template-columns: repeat(
                                    3,
                                    minmax(0, 1fr)
                                );
                                gap: 8px;
                                border-top: 1px solid var(--line);
                                padding-top: 10px;
                            "
                        >
                            <div style="display: flex; flex-direction: column">
                                <span
                                    style="font-size: 12px; color: var(--muted)"
                                    >Requested</span
                                ><span
                                    style="
                                        font-size: 24px;
                                        font-weight: 700;
                                        color: var(--ink);
                                    "
                                    >{{reqTxt}}</span
                                >
                            </div>
                            <div style="display: flex; flex-direction: column">
                                <span
                                    style="font-size: 12px; color: var(--muted)"
                                    >Suggested</span
                                ><span
                                    style="
                                        font-size: 24px;
                                        font-weight: 700;
                                        color: var(--ink);
                                    "
                                    >{{suggTxt}}</span
                                >
                            </div>
                            <div style="display: flex; flex-direction: column">
                                <span
                                    style="font-size: 12px; color: var(--muted)"
                                    >Profit</span
                                ><span
                                    style="
                                        font-size: 24px;
                                        font-weight: 700;
                                        color: var(--ink);
                                    "
                                    >{{marginTxt}}</span
                                >
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column">
                            <div class="row">
                                <span>Net price</span
                                ><span>{{netTxt}} / pc</span>
                            </div>
                            <div class="row">
                                <span>Line total</span><span>{{totTxt}}</span>
                            </div>
                            <div class="row">
                                <span>Sent to</span><span>{{who}}</span>
                            </div>
                            <sc-if
                                value="{{hasWhen}}"
                                hint-placeholder-val="{{ true }}"
                                ><div class="row">
                                    <span>Sent on</span><span>{{when}}</span>
                                </div></sc-if
                            >
                        </div>
                        <sc-if
                            value="{{hasCauses}}"
                            hint-placeholder-val="{{ true }}"
                        >
                            <div
                                style="display: flex; flex-wrap: wrap; gap: 6px"
                            >
                                <sc-for
                                    list="{{causes}}"
                                    as="c"
                                    hint-placeholder-count="3"
                                    ><span class="chip">{{c}}</span></sc-for
                                >
                            </div>
                        </sc-if>
                        <sc-if
                            value="{{hasNote}}"
                            hint-placeholder-val="{{ true }}"
                        >
                            <p style="font-size: 13px; color: var(--muted)">
                                Your note: “{{note}}”
                            </p>
                        </sc-if>
                    </div>

                    <button
                        type="button"
                        class="btn sec"
                        sc-camel-on-click="{{backToEngine}}"
                    >
                        Back to engine
                    </button>
                </div>
            </div>
        </x-dc>
        <script
            type="text/x-dc"
            data-dc-script=""
            data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"light","section":"Appearance"},"minMargin":{"editor":"int","min":5,"max":50,"default":25,"unit":"%","section":"Thresholds"},"$preview":{"width":390,"height":844}}'
        >
            const LOCALE = 'en-GB';
            const EUR = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: 'EUR' });
            const fE = (v) => EUR.format(v);
            const fP = (v) => Number(v).toLocaleString(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';

            // fallback if the page is opened directly (same scenario the page had before)
            const DEMO_NET = 247.72 * (1 - 41 / 100);
            const DEMO = {
              cust: 'C-10234', channel: 'Dealer', nation: 'Italy', art: 'EKO 380×380×150 custom', qty: 20,
              sugg: 29.5, req: 41, net: DEMO_NET, margin: (DEMO_NET - 112.60) / DEMO_NET * 100,
              who: 'Sales director, Italy area', note: 'Competitor quoting lower, strategic customer.',
              causes: ['Few historical cases (3)', 'Custom product', 'Margin below threshold', 'Discount above maximum'], when: ''
            };

            function loadRequest() {
              try { const raw = sessionStorage.getItem('spe-request'); if (raw) return Object.assign({}, DEMO, JSON.parse(raw)); } catch (err) { /* storage blocked */ }
              return DEMO;
            }

            class Component extends DCLogic {
              constructor(props) {
                super(props);
                this.state = { q: loadRequest() };
              }
              renderVals() {
                const q = this.state.q;
                const theme = this.props.theme ?? 'light';
                return {
                  themeClass: theme === 'dark' ? 'dark' : theme === 'light' ? 'light' : 'auto',
                  sentText: '',
                  custLine: q.cust + ' · ' + q.channel + ' · ' + q.nation,
                  artLine: q.art + ' · ' + q.qty + ' pcs',
                  reqTxt: fP(q.req), suggTxt: fP(q.sugg), marginTxt: fP(q.margin),
                  netTxt: fE(q.net), totTxt: fE(q.net * q.qty),
                  who: q.who, when: q.when, hasWhen: !!q.when,
                  causes: q.causes || [], hasCauses: !!(q.causes && q.causes.length),
                  note: q.note, hasNote: !!q.note,
                  backToEngine: () => { window.location.href = './'; }
                };
              }
            }
        </script>
    </body>
</html>
